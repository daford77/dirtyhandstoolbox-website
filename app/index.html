<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <!-- Placeholder for base href -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Offline-first garage and build tracker for vehicles, parts, torque specs, and maintenance.">
  <meta name="theme-color" content="#FF6700">

  <!-- Cache-busting: encourage browser to check for new index.html -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Dirty Hands Toolbox">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dirty Hands Toolbox</title>
  <link rel="manifest" href="manifest.json">
  <!-- Google Identity Services – required for google_sign_in_web -->
  <meta name="google-signin-client_id" content="1031676598938-50avkq0v1t8a2u0m3nugqote9i9s2ql4.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Handle Google Identity Services One Tap UI callbacks
    // This prevents GSI_LOGGER warnings about deprecated status methods
    // when FedCM becomes mandatory. Opt-in to FedCM for future compatibility.
    window.addEventListener('load', function() {
      // Wait for google object to be available
      if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
        // Set up One Tap UI handlers that use callbacks instead of deprecated status methods
        // The flutter google_sign_in_web plugin handles initialization; we just set up the callbacks
        try {
          google.accounts.id.oneTapPromptMomentsListener({
            onDisplay: function() {
              console.debug('[GSI] One Tap prompt displayed');
            },
            onSkipped: function() {
              console.debug('[GSI] One Tap prompt skipped');
            },
            onDismissed: function() {
              console.debug('[GSI] One Tap prompt dismissed by user');
            },
            onError: function(error) {
              console.debug('[GSI] One Tap error:', error);
            }
          });
        } catch (e) {
          // Silently ignore if the method doesn't exist (older GSI versions)
          console.debug('[GSI] One Tap listener setup skipped:', e.message);
        }
      }
    });
  </script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-W77TXWFY3E"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Disable auto page view and send page views on SPA route changes below.
    gtag('config', 'G-W77TXWFY3E', { send_page_view: false });

    (function setupSpaTracking() {
      function trackCurrentPage() {
        gtag('event', 'page_view', {
          page_title: document.title,
          page_location: window.location.href,
          page_path: window.location.pathname + window.location.search + window.location.hash,
        });
      }

      const pushState = history.pushState;
      const replaceState = history.replaceState;

      history.pushState = function() {
        pushState.apply(this, arguments);
        trackCurrentPage();
      };

      history.replaceState = function() {
        replaceState.apply(this, arguments);
        trackCurrentPage();
      };

      window.addEventListener('popstate', trackCurrentPage);
      window.addEventListener('load', trackCurrentPage);

      window.addEventListener('beforeinstallprompt', function(e) {
        gtag('event', 'pwa_install_prompt_available');
        if (e && e.userChoice && typeof e.userChoice.then === 'function') {
          e.userChoice.then(function(choice) {
            gtag('event', choice.outcome === 'accepted' ? 'pwa_install_accepted' : 'pwa_install_dismissed');
          });
        }
      });

      window.addEventListener('appinstalled', function() {
        gtag('event', 'pwa_installed');
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Logic to detect and force-apply Service Worker updates
    window.addEventListener('load', function(ev) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function(registration) {
          registration.addEventListener('updatefound', function() {
            const newWorker = registration.installing;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New content is available, skip waiting and reload
                newWorker.postMessage({ type: 'SKIP_WAITING' });
                window.location.reload();
              }
            });
          });
        });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    });
  </script>
</body>
</html>
